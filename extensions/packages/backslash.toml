[extension]
id = "packages"
title = "Packages"
description = "Search your distribution's packages and Flathub"
version = "1.1.0"
author = "Backslash"
icon = "bs-package"
license = "MIT"

[permissions]
run = ["apt-cache", "dnf", "pacman", "zypper", "flatpak"]

[[commands]]
name = "search"
title = "Search Packages"
keywords = ["apt", "dnf", "pacman", "zypper", "flatpak", "install", "software"]
