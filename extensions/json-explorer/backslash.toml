[extension]
id = "json-explorer"
title = "JSON Explorer"
description = "Validate, browse and query the JSON in your clipboard, then copy values, paths or YAML, TOML and CSV"
version = "1.0.0"
author = "Backslash"
icon = "bs-braces"
license = "MIT"

[permissions]
# The JSON to explore comes from the clipboard. Nothing leaves your computer.
clipboard-read = true

[[commands]]
name = "explore"
title = "Explore JSON"
description = "The clipboard's JSON as a tree: filter keys or query with .a.b[0], ..name, [?(@.x > 1)], | keys"
icon = "bs-braces"
keywords = [
  "json",
  "jq",
  "jsonpath",
  "tree",
  "validate",
  "query",
  "path",
  "yaml",
  "toml",
  "csv",
  "convert",
  "valider",
  "explorer",
  "arbre",
  "convertir",
  "presse-papiers",
]

[[commands]]
name = "format"
title = "Format JSON in Clipboard"
description = "Pretty-prints the clipboard's JSON with two-space indentation"
icon = "bs-braces"
mode = "no-view"
keywords = ["json", "pretty", "prettify", "beautify", "indent", "formater", "indenter"]

[[commands]]
name = "minify"
title = "Minify JSON in Clipboard"
description = "Removes the whitespace from the clipboard's JSON"
icon = "bs-braces"
mode = "no-view"
keywords = ["json", "minify", "compact", "uglify", "compresser", "minifier"]
