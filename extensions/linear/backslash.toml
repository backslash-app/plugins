[extension]
id = "linear"
title = "Linear"
description = "Your issues with their status, priority, labels and assignee; search, triage and quick issue creation"
version = "1.1.0"
author = "Backslash"
icon = "bs-circle-half"
license = "MIT"
categories = ["productivity"]

[permissions]
net = ["api.linear.app", "public.linear.app"]

[[commands]]
name = "my-issues"
title = "My Linear Issues"
description = "Assigned, created or subscribed issues, by status"
keywords = ["linear", "issues", "tickets", "tasks", "todo"]

[[commands]]
name = "search-issues"
title = "Search Linear Issues"
keywords = ["linear", "issues", "find", "tickets"]

[[commands]]
name = "create-issue"
title = "Create Linear Issue"
keywords = ["linear", "new", "issue", "bug", "ticket"]

[[preferences]]
name = "apiKey"
title = "Personal API key"
description = "Linear → Settings → Security & access → Personal API keys"
type = "secret"
required = true
