[[commands]]
name = "top-half"
title = "Top Half"
description = "Snap the window to the top half of the screen"
icon = "bs-window"
mode = "no-view"
keywords = ["window", "fenêtre", "tile top", "snap top", "moitié haut", "haut"]

[[commands]]
name = "bottom-half"
