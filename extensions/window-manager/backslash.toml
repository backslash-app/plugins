description = "Snap the window to the bottom left quarter"
icon = "bs-window"
mode = "no-view"
keywords = ["window", "fenêtre", "quarter", "corner", "coin", "quart", "bas gauche"]

[[commands]]
name = "bottom-right"
title = "Bottom Right Quarter"
description = "Snap the window to the bottom right quarter"
icon = "bs-window"
mode = "no-view"
keywords = ["window", "fenêtre", "quarter", "corner", "coin", "quart", "bas droite"]

[[commands]]
name = "maximize"
