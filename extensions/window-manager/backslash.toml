[[commands]]
name = "top-right"
title = "Top Right Quarter"
description = "Snap the window to the top right quarter"
icon = "bs-window"
mode = "no-view"
keywords = ["window", "fenêtre", "quarter", "corner", "coin", "quart", "haut droite"]

[[commands]]
name = "bottom-left"
