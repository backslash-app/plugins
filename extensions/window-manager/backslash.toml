[extension]
id = "window-manager"
title = "Window Manager"
description = "Snap, maximize, center, close and move the focused window between workspaces"
version = "1.0.0"
author = "Backslash"
icon = "bs-window"
license = "MIT"

# One backend per desktop, the first that answers: hyprctl (Hyprland), swaymsg (Sway),
# gdbus to KWin's global shortcuts (KDE Plasma) or to the "Window Calls" Shell
# extension (GNOME on Wayland), wmctrl + xdotool + xrandr (X11). gsettings reads
# GNOME's workspace count. Extensions aren't told which window had the focus,
# so actions run from a short systemd-run --user job once the launcher has hidden.
[permissions]
run = ["systemd-run", "hyprctl", "swaymsg", "gdbus", "gsettings", "wmctrl", "xrandr"]
read = ["/etc/os-release"]
env = [
  "XDG_SESSION_TYPE",
  "XDG_CURRENT_DESKTOP",
  "WAYLAND_DISPLAY",
  "DISPLAY",
  "XAUTHORITY",
  "HYPRLAND_INSTANCE_SIGNATURE",
  "SWAYSOCK",
  "DBUS_SESSION_BUS_ADDRESS",
]

[[commands]]
name = "windows"
title = "Window Manager"
description = "Every window action and your workspaces in one list"
icon = "bs-window"
keywords = ["window", "fenêtre", "tile", "tiling", "snap", "workspace", "espace de travail", "bureau virtuel", "layout", "disposition"]

[[commands]]
name = "left-half"
title = "Left Half"
description = "Snap the window to the left half of the screen"
icon = "bs-window"
mode = "no-view"
keywords = ["window", "fenêtre", "tile left", "snap left", "moitié gauche", "gauche", "fenêtre gauche"]

[[commands]]
name = "right-half"
title = "Right Half"
description = "Snap the window to the right half of the screen"
icon = "bs-window"
mode = "no-view"
