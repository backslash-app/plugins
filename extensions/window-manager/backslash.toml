title = "Close Window"
description = "Close the window you were in"
icon = "bs-x"
mode = "no-view"
keywords = ["window", "fenêtre", "fermer", "kill", "quit", "quitter fenêtre"]

[[commands]]
name = "move-to-workspace"
title = "Move Window to Workspace"
description = "Send the window to workspace N and follow it"
icon = "bs-arrow-right"
mode = "no-view"
keywords = ["window", "fenêtre", "workspace", "espace de travail", "bureau", "déplacer", "move", "send"]
[[commands.arguments]]
name = "workspace"
placeholder = "Workspace"
type = "number"
min = 1
max = 99
required = true

[[commands]]
name = "switch-workspace"
title = "Switch to Workspace"
description = "Show workspace N"
icon = "bs-layers"
mode = "no-view"
keywords = ["workspace", "espace de travail", "bureau", "changer", "switch", "go to", "aller"]
[[commands.arguments]]
name = "workspace"
placeholder = "Workspace"
type = "number"
min = 1
max = 99
required = true

[[preferences]]
name = "delay"
title = "Delay before acting (milliseconds)"
description = "Time for the launcher to hide and the focus to return to your window; raise it if actions hit the wrong window"
type = "number"
default = 250
