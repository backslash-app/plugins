mode = "no-view"
keywords = ["window", "fenêtre", "centrer", "middle", "milieu"]

[[commands]]
name = "fullscreen"
title = "Toggle Fullscreen"
description = "Make the window fullscreen, or leave fullscreen"
icon = "bs-monitor"
mode = "no-view"
keywords = ["window", "fenêtre", "plein écran", "full screen", "f11"]

[[commands]]
name = "toggle-floating"
title = "Toggle Floating"
description = "Float the window or put it back in the tiling layout (Hyprland, Sway)"
