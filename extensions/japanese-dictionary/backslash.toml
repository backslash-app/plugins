[extension]
id = "japanese-dictionary"
title = "Japanese Dictionary"
description = "Japanese words from Jisho with readings, meanings, JLPT level and common-word tags, the kanji they are written with, and romaji typed as kana"
version = "1.0.0"
author = "Backslash"
icon = "bs-font"
license = "MIT"
categories = ["everyday"]

# Words from Jisho (JMdict), kanji details from kanjiapi.dev (KANJIDIC). Both are free and need no key.
# Romaji is converted to kana on your computer.
[permissions]
net = ["jisho.org", "kanjiapi.dev"]

[[commands]]
name = "japanese"
title = "Japanese Dictionary"
description = "Type English, romaji, kana or kanji: cat, neko, ねこ, 猫"
icon = "bs-font"
keywords = [
  "japanese",
  "jisho",
  "kanji",
  "kana",
  "hiragana",
  "katakana",
  "romaji",
  "jlpt",
  "nihongo",
  "日本語",
  "辞書",
  "japonais",
  "dictionnaire japonais",
  "traduire en japonais",
]
