[extension]
id = "dotenv"
title = "Env Files"
description = "The .env files of your projects with their variables masked, the keys missing from .env.example, and copy or export them"
version = "1.0.0"
author = "Backslash"
icon = "bs-key"
license = "MIT"
categories = ["developer"]

# .env files are looked for in the usual code folders below your home (the
# folders preference can only point inside them). Writing there only ever
# appends the keys missing from a .env.example to the .env file you pick.
# HOME locates them.
[permissions]
env = ["HOME"]
read = [
  "~/Projects",
  "~/projects",
  "~/Code",
  "~/code",
  "~/dev",
  "~/Developer",
  "~/src",
  "~/git",
  "~/repos",
  "~/workspace",
  "~/work",
  "~/Work",
]
write = [
  "~/Projects",
  "~/projects",
  "~/Code",
  "~/code",
  "~/dev",
  "~/Developer",
  "~/src",
  "~/git",
  "~/repos",
  "~/workspace",
  "~/work",
  "~/Work",
]

[[commands]]
name = "files"
title = "Env Files"
description = ".env, .env.local, .env.production… by project: variables, missing keys, copy values and export lines"
icon = "bs-key"
keywords = [
  "env",
  "dotenv",
  ".env",
  "environment",
  "variables",
  "environment variables",
  "secrets",
  "config",
  "env.example",
  "export",
  "variables d'environnement",
  "fichier env",
  "secret",
  "configuration",
]

[[preferences]]
name = "folders"
title = "Folders"
description = "Where to look for .env files, separated by commas; inside ~/Projects, ~/code, ~/Code, ~/src, ~/dev, ~/Developer, ~/git, ~/repos, ~/workspace or ~/work"
default = "~/Projects, ~/projects, ~/code, ~/Code, ~/src, ~/dev, ~/git, ~/repos, ~/workspace, ~/work"

[[preferences]]
name = "depth"
title = "Scan depth"
description = "How many folders deep to look below each folder (1 to 8)"
type = "number"
default = 3

[[preferences]]
name = "examples"
title = "Show example files"
description = "Also list .env.example, .env.sample and .env.template as rows"
type = "boolean"
default = true
