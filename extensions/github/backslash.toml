[extension]
id = "github"
title = "GitHub"
description = "Pull requests with their checks and reviews, your issues, and repository search"
version = "1.1.0"
author = "Backslash"
icon = "bs-repo"
license = "MIT"

[permissions]
net = ["api.github.com", "avatars.githubusercontent.com"]
# Uses the GitHub CLI's sign-in when no token is set.
run = ["gh"]

[[commands]]
name = "repositories"
title = "Search GitHub Repositories"
keywords = ["github", "repo", "git", "code"]

[[commands]]
name = "pull-requests"
title = "My Pull Requests"
description = "To review, opened by you, assigned: with checks and reviews"
keywords = ["github", "pr", "review", "ci"]

[[commands]]
name = "issues"
title = "My GitHub Issues"
description = "Assigned to you, opened by you, mentioning you"
keywords = ["github", "issues", "bugs", "tickets"]

[[preferences]]
name = "token"
title = "Personal access token"
description = "Optional when the GitHub CLI is signed in (gh auth login). Read-only scopes are enough."
type = "secret"
