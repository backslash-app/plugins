[extension]
id = "gists"
title = "Gists"
description = "Your GitHub gists with their code in the preview: copy, paste, create from the clipboard, delete"
version = "1.0.0"
author = "Backslash"
icon = "bs-code"
license = "MIT"

# The REST API, avatars, and raw files for contents over 1 MB (which the API truncates).
# gh gives its sign-in when no token is set; the clipboard is read to create a gist from it.
[permissions]
net = ["api.github.com", "avatars.githubusercontent.com", "gist.githubusercontent.com"]
run = ["gh"]
clipboard-read = true

[[commands]]
name = "gists"
title = "Search Gists"
description = "Your gists, public, secret or starred, with their files' contents"
icon = "bs-code"
keywords = ["gist", "gists", "github", "snippet", "snippets", "code", "paste", "extrait", "bout de code"]

[[commands]]
name = "new"
title = "Create Gist from Clipboard"
description = "A new public or secret gist with the copied text"
icon = "bs-plus"
keywords = ["gist", "new gist", "share", "paste", "clipboard", "snippet", "nouveau", "partager", "presse-papiers"]

[[preferences]]
name = "token"
title = "Personal access token"
description = "Optional when the GitHub CLI is signed in (gh auth login). Needs the gist scope"
type = "secret"
